<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu perfil · e.lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap');
:root{--paper:#fbfaf7;--ink:#29211d;--muted:#9e9188;--line:#ddd5ce;--accent:#9e7561;--dark:#2b231f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Inter,Arial,sans-serif;font-weight:300}button,input{font:inherit}button{cursor:pointer}header{height:70px;border-bottom:1px solid #ebe6e1;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-family:'Cormorant Garamond',serif;font-size:27px;letter-spacing:-.04em}.brand em{font-style:normal;color:var(--accent)}.top-note{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}main{min-height:calc(100vh - 70px);display:flex;justify-content:center}.screen{width:min(900px,100%);padding:10vh 7vw 8vh}.intro{display:grid;grid-template-columns:1fr 350px;gap:80px;align-items:center;max-width:1100px;width:100%;margin:auto}.intro-copy{max-width:500px}.kicker{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px}.kicker:before{content:'';height:1px;width:42px;background:var(--muted)}h1,h2{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:-.055em;line-height:.86}h1{font-size:clamp(58px,8vw,104px);margin:36px 0 28px}h1 em,h2 em{font-style:italic}.intro p{font-size:13px;line-height:1.9;color:#84766e;max-width:380px}.start-row{display:flex;align-items:center;gap:24px;margin-top:36px}.primary{border:0;background:var(--dark);color:#fffaf5;border-radius:30px;padding:15px 26px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;transition:.2s}.primary:hover{background:#4a3930;transform:translateY(-1px)}.time{font-size:10px;color:var(--muted)}.privacy{display:flex;gap:8px;align-items:center;margin-top:42px;color:#aa9d94;font-size:10px}.art{height:500px;position:relative}.shape{position:absolute;border-radius:170px;width:280px;height:410px;transform:rotate(8deg);right:40px;top:10px;background:#ae8975}.shape.two{transform:rotate(-7deg);right:0;top:-4px;background:#d6c4b3}.art-card{position:absolute;right:0;bottom:0;width:310px;background:#fbfaf7ed;border-left:1px solid #bca99b;border-top:1px solid #bca99b;padding:34px}.art-card h2{font-size:36px;margin:20px 0}.art-card p{font-size:11px;line-height:1.8;color:#877870}.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:75px}.progress{height:1px;background:var(--line);flex:1}.progress i{display:block;height:1px;background:var(--ink);transition:.3s}.count{font-size:9px;color:var(--muted);letter-spacing:.16em}.question h2{font-size:clamp(50px,7vw,80px);margin:0 0 14px;max-width:700px}.subtitle{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#aa9d94;margin:0 0 42px}.field{width:100%;border:0;border-bottom:1px solid #b8a79b;background:transparent;padding:16px 0;color:var(--ink);font-size:18px;outline:0}.field:focus{border-color:var(--ink)}.field::placeholder{color:#c4b8af}.choices{display:flex;flex-wrap:wrap;gap:10px;max-width:700px}.choice{border:1px solid #d8cdc5;border-radius:28px;background:transparent;color:#816f65;padding:13px 19px;font-size:12px;transition:.18s}.choice:hover,.choice.selected{border-color:var(--ink);background:var(--dark);color:#fffaf5}.optional-note{margin-top:18px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:70px}.ghost{background:transparent;border:0;color:#aa9d94;font-size:10px;letter-spacing:.2em;text-transform:uppercase}.ghost:hover{color:var(--ink)}.action-right{display:flex;gap:25px;align-items:center}.result{max-width:700px;margin:auto}.result h1{margin-top:25px}.result-card{border:1px solid #ded4cc;border-radius:30px;padding:34px;margin-top:48px;background:#fffdf9}.result-card small{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.result-card h2{font-size:38px;margin:17px 0}.result-card p{font-size:13px;line-height:1.9;color:#806f65}.admin{position:fixed;right:24px;bottom:20px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#b1a49b;text-decoration:none}.admin-panel{max-width:900px;margin:auto;padding:8vh 6vw}.admin-panel h1{font-size:70px;margin:20px 0}.records{margin-top:38px;display:grid;gap:10px}.record{border:1px solid var(--line);padding:18px 20px;background:#fffdf9}.record summary{cursor:pointer;display:flex;justify-content:space-between;gap:20px;list-style:none}.record summary::-webkit-details-marker{display:none}.record-name{font-family:'Cormorant Garamond',serif;font-size:25px}.record-meta{font-size:10px;color:var(--muted);margin-top:4px}.record-result{text-align:right;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}.answers{border-top:1px solid var(--line);margin-top:18px;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.answers b{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}.answers span{display:block;font-size:12px;margin-top:4px}.export{margin-top:24px}.hidden{display:none}@media(max-width:760px){header{padding:0 22px}.screen{padding:8vh 24px}.intro{display:block}.art{display:none}.start-row{align-items:flex-start;flex-direction:column;gap:14px}.progress-row{margin-bottom:52px}.actions{margin-top:50px}.answers{grid-template-columns:1fr}.record summary{display:block}.record-result{text-align:left;margin-top:8px}}
</style>
</head>
<body>
<header><a class="brand" href="#">e.lab<span>.</span></a><span class="top-note">perfil salvo com carinho</span></header>
<main id="app"></main>
<a class="admin" href="#admin">acesso privado</a>
<script>
const questions=[
{id:'name',title:'Como prefere ser chamada?',type:'text',placeholder:'seu nome'},
{id:'whatsapp',title:'WhatsApp',subtitle:'para confirmações com carinho',type:'text',placeholder:'seu número'},
{id:'birthday',title:'Data de aniversário para seu mimo',type:'text',placeholder:'dia e mês'},
{id:'discovery',title:'Como conheceu a e.lab?',options:['indicação de amiga','Instagram','passei na porta','Google','já sou cliente']},
{id:'ritual',title:'Qual bebida te acompanha?',options:['café especial','chá da tarde','água com gás','espumante','água natural']},
{id:'service',title:'Como gosta de ser atendida?',options:['adoro conversar','prefiro silêncio para relaxar','equilíbrio entre os dois','gosto de dicas durante']},
{id:'goal',title:'O que você busca hoje?',options:['iluminar','praticidade','sofisticação','mudança leve','manutenção','corte com movimento','tratamento profundo']},
{id:'hair',title:'O que mais ama no seu cabelo?',subtitle:'para realçarmos ainda mais',options:['brilho','volume','cor','textura natural','comprimento','definição','praticidade']},
{id:'routine',title:'Como é sua rotina real hoje?',subtitle:'lavagem, calor e tempo',options:['5 min por dia · lavo todo dia','15 min com secador sempre','lavo 2x na semana · evito calor','só no salão · zero tempo','rotina completa com protetor térmico','começando agora · minimalista']},
{id:'care',title:'Algo importante para cuidarmos com atenção?',subtitle:'histórico e sensibilidades',options:['coloração nos últimos meses','mechas ou descoloração','progressiva botox ou selagem','couro sensível ou com oleosidade','alergia a tintura ou perfume','gestante ou amamentando','nenhum ponto de atenção']},
{id:'change',title:'O que gostaria de realçar ou mudar?',options:['menos frizz','mais brilho','mais definição','crescimento','menos volume','mais praticidade','cor mais viva']},
{id:'products',title:'Produtos que ama ou quer conhecer',options:['shampoo sem sulfato','máscara de nutrição','leave in','óleo finalizador','protetor térmico','aberto a indicação']},
{id:'inspiration',title:'Inspiração que te faz brilhar os olhos',options:['natural iluminado','loiro sofisticado','morena iluminada','ruivo','corte curto','cabelo longo','referência do Instagram'],placeholder:'link do Instagram ou descrição opcional'}
];
let state={screen:'intro',step:0,answers:{}};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){if(location.hash==='#admin'){renderAdmin();return} if(state.screen==='intro')renderIntro(); else if(state.screen==='result')renderResult(); else renderQuestion()}
function renderIntro(){app.innerHTML=`<section class="screen intro"><div class="intro-copy"><div class="kicker">experiência de cuidado</div><h1>Meu perfil<br><em>e.lab</em></h1><p>Responda algumas perguntas para que possamos conhecer você, seus hábitos e tudo o que faz seu cabelo brilhar.</p><div class="start-row"><button class="primary" onclick="start()">começar →</button><span class="time">leva cerca de 40 segundos</span></div><div class="privacy">◌ suas respostas ficam registradas com privacidade</div></div><div class="art"><div class="shape two"></div><div class="shape"></div><div class="art-card">✦<h2>um cuidado<br><em>com a sua cara</em></h2><p>Preferências, desejos e pequenos detalhes que fazem toda diferença.</p></div></div></section>`}
function start(){state={screen:'quiz',step:0,answers:{}};location.hash='';render()}
function renderQuestion(){const q=questions[state.step],a=state.answers[q.id]||'';const pct=((state.step+1)/questions.length)*100;let content=q.type==='text'?`<input id="answer" class="field" placeholder="${esc(q.placeholder)}" value="${esc(a)}" autofocus>`:`<div class="choices">${q.options.map(o=>`<button class="choice ${a===o?'selected':''}" onclick="choose('${esc(o)}')">${esc(o)}</button>`).join('')}</div>${q.id==='inspiration'&&a==='referência do Instagram'?`<input id="note" class="field optional-note" placeholder="${esc(q.placeholder)}" value="${esc(state.answers.note||'')}">`:''}`;app.innerHTML=`<section class="screen"><div class="progress-row"><div class="progress"><i style="width:${pct}%"></i></div><span class="count">${String(state.step+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}</span></div><div class="question"><h2>${esc(q.title)}</h2>${q.subtitle?`<p class="subtitle">${esc(q.subtitle)}</p>`:''}${content}</div><div class="actions"><button class="ghost" onclick="back()">← voltar</button><div class="action-right"><button class="ghost" onclick="skip()">pular</button>${q.type==='text'||(q.id==='inspiration'&&a==='referência do Instagram')?`<button class="primary" onclick="next()">${state.step===questions.length-1?'finalizar':'continuar'} →</button>`:''}</div></div></section>`}
function choose(value){state.answers[questions[state.step].id]=value;if(questions[state.step].id==='inspiration'&&value==='referência do Instagram'){render();return}setTimeout(next,110)}
function next(){const q=questions[state.step];if(q.type==='text'){const input=document.getElementById('answer');if(input)state.answers[q.id]=input.value.trim()}if(q.id==='inspiration'){const note=document.getElementById('note');if(note)state.answers.note=note.value.trim()}if(state.step<questions.length-1){state.step++;render()}else finish()}
function skip(){if(state.step<questions.length-1){state.step++;render()}else finish()}
function back(){if(state.step>0){state.step--;render()}else{state.screen='intro';render()}}
function finish(){const goal=state.answers.goal||'',change=state.answers.change||'';let title=goal.includes('iluminar')||change.includes('brilho')?'luminosidade com leveza':goal.includes('praticidade')||change.includes('praticidade')?'praticidade sofisticada':goal.includes('mudança')||goal.includes('corte')?'transformação com intenção':'cuidado feito para você';const name=state.answers.name||'seu perfil';const record={...state.answers,result:title,created:new Date().toISOString()};const records=JSON.parse(localStorage.getItem('elab_profiles')||'[]');records.push(record);localStorage.setItem('elab_profiles',JSON.stringify(records));state.result={title,name};state.screen='result';render()}
function renderResult(){const r=state.result;app.innerHTML=`<section class="screen result"><div class="kicker">${esc(r.name)}, seu</div><h1>perfil<br><em>está salvo</em></h1><div class="result-card"><small>seu ponto de partida</small><h2>${esc(r.title)}</h2><p>Suas preferências e escolhas foram registradas. Guardamos os detalhes para que cada próximo encontro comece entendendo você — com leveza, escuta e um cuidado que combina com a sua rotina.</p></div><div class="start-row"><button class="ghost" onclick="start()">↺ refazer</button><span class="time">Obrigada por se permitir.</span></div></section>`}
function renderAdmin(){const records=JSON.parse(localStorage.getItem('elab_profiles')||'[]');app.innerHTML=`<section class="admin-panel"><div class="kicker">área privada</div><h1>perfis<br><em>salvos</em></h1><p class="time">Este registro é local e privado neste navegador.</p><button class="primary export" onclick="exportCsv()">baixar registros csv</button><div class="records">${records.length?records.slice().reverse().map(record=>`<details class="record"><summary><div><div class="record-name">${esc(record.name||'perfil sem nome')}</div><div class="record-meta">${new Date(record.created).toLocaleString('pt-BR')} ${record.whatsapp?' · '+esc(record.whatsapp):''}</div></div><div class="record-result">${esc(record.result)}</div></summary><div class="answers">${Object.entries(record).filter(([k])=>!['created','result','note'].includes(k)).map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v||'não informado')}</span></div>`).join('')}</div></details>`).join(''):'<div class="record">nenhum perfil registrado neste navegador.</div>'}</div></section>`}
function exportCsv(){const rows=JSON.parse(localStorage.getItem('elab_profiles')||'[]');const csv=[['nome','whatsapp','resultado','criado_em'],...rows.map(r=>[r.name||'',r.whatsapp||'',r.result||'',new Date(r.created).toLocaleString('pt-BR')])].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='perfis-elab.csv';a.click()}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
